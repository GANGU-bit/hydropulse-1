# =============================================================================
# HydroPulse — Jules preflight (read-only connectivity check)
# =============================================================================
# Purpose: diagnose "why did my PR get no review?" without spending a Jules
# session. It calls the REST API metadata endpoint only (GET /v1alpha/sources),
# which does not create sessions and does not consume review quota.
#
# It prints ONLY status codes, a source count and a connected yes/no. The API
# key is sent in a request header (never in a URL) and is never echoed.
#
# Run it from: Actions > "Jules preflight (connectivity check)" > Run workflow.
# =============================================================================

name: Jules preflight (connectivity check)

on:
  workflow_dispatch:

# This workflow never uses the GitHub token: it only calls the Jules metadata API.
# An empty permissions map grants the GITHUB_TOKEN no scopes at all.
permissions: {}

jobs:
  preflight:
    name: Check Jules auth and repo connection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify JULES_API_KEY is configured
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${JULES_API_KEY:-}" ]; then
            echo "::error title=Jules API key is missing::Repository secret JULES_API_KEY is not set. Add it under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "Secret present (value never printed)."

      - name: Query Jules sources
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          TARGET_SOURCE: sources/github/Rossonerian/hydropulse
        run: |
          set -uo pipefail

          # Do NOT use set -x here: it would print the auth header.
          if ! status=$(curl -sS -o /tmp/jules-sources.json -w '%{http_code}' \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            "https://jules.googleapis.com/v1alpha/sources"); then
            status="000"
          fi

          echo "Jules API HTTP status: ${status}"

          case "${status}" in
            200)
              total=$(jq '.sources | length' /tmp/jules-sources.json 2>/dev/null || echo "?")
              if jq -e --arg s "${TARGET_SOURCE}" \
                   '.sources[]? | select(.name == $s)' \
                   /tmp/jules-sources.json >/dev/null 2>&1; then
                connected="yes"
              else
                connected="no"
              fi
              echo "Sources visible to this key: ${total}"
              echo "Target repo connected: ${connected}"
              {
                echo "### Jules preflight"
                echo ""
                echo "| Check | Result |"
                echo "| --- | --- |"
                echo "| API key present | yes |"
                echo "| Jules API reachable | yes (HTTP 200) |"
                echo "| Sources visible | ${total} |"
                echo "| \`${TARGET_SOURCE}\` connected | **${connected}** |"
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "${connected}" != "yes" ]; then
                echo "::error title=Repository not connected to Jules::Install the Jules GitHub app for the Rossonerian account and grant it access to hydropulse. Reviews cannot run until then; the PR stays mergeable."
                exit 1
              fi
              ;;
            401|403)
              echo "::error title=Jules authentication failed::JULES_API_KEY was rejected (HTTP ${status}). It may be revoked, mistyped, or auto-disabled for being exposed. Create a new key at jules.google.com > Settings > API and update the secret."
              exit 1
              ;;
            429)
              echo "::error title=Jules rate limit or quota exhausted::HTTP 429 returned. Wait for the quota window to reset (free tier: 15 sessions / 24h). Do not retry in a loop. The PR stays mergeable."
              exit 1
              ;;
            *)
              echo "::error title=Jules API unavailable::Unexpected HTTP ${status} from jules.googleapis.com. This is an upstream or network failure, not a repository configuration problem. Do not retry in a loop; the PR stays mergeable."
              exit 1
              ;;
          esac
